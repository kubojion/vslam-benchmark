bdo_undist: 0
finit_parallax: 20.0
use_shi_tomasi: 0
use_fast: 0
use_brief: 1
use_singlescale_detector: 1
nmaxdist: 55
nfast_th: 10
dmaxquality: 0.001
use_clahe: 1
fclahe_val: 3
do_klt: 1
klt_use_prior: 1
btrack_keyframetoframe: 0
