ORB_SLAM3_STEREO_ROS2:
  ros__parameters:
    robot_base_frame: base_footprint
    global_frame: map
    odom_frame: odom
    left_image_topic_name: /orb/zed_left/image_raw
    right_image_topic_name: /orb/zed_right/image_raw

    robot_x: 0.0
    robot_y: 0.0
    robot_z: 0.0
    robot_qx: 0.0
    robot_qy: 0.0
    robot_qz: 0.0
    robot_qw: 1.0

    visualization: false
    odometry_mode: false
    publish_tf: false
    map_data_publish_frequency: 1000
    do_loop_closing: false
