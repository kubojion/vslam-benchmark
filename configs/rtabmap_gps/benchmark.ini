# RTAB-Map stereo + IMU + GNSS benchmark profile.
#
# Keep this file intentionally small: unspecified settings use the installed
# RTAB-Map defaults. Camera calibration, TF extrinsics and playback transport
# are sensor overlays supplied by run_rtabmap_gps.sh.
[Core]
Optimizer\Strategy = 1
Optimizer\PriorsIgnored = false
Optimizer\Robust = true
Vis\EstimationType = 1
Odom\Strategy = 0
